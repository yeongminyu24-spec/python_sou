
<!DOCTYPE html>     <!--<!DOCTYPE html> 있어야 html-5이다. 없으면 html이다.-->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">





</head>
<body>
    <h3>* 반복문 while *</h3>
    <script>
        let k =0;
        while(k<10){
            k++;
            if (k===3 || k ===5) continue;
            document.write(k+" ")
            if (k===8) break;


        }
    </script>
    
</body>
</html>
