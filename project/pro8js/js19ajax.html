    function funcCsv(){
            let xhr = new XMLHttpRequest();    // 서버에 AJAX 요청을 보내기 위한 객체를 하나 만듬 

            xhr.open("GET", "sangpum.csv",true);
            xhr.onreadystatechange = function(){
                if(xhr.readyState === 4 && xhr.status === 200){  // 4는 통신 상태 양호 한지 확인, 200은 내가 요청한 파일이 멀쩡하다면

                //let data = xhr.responseText;

                //alert(typeof(data));  // object : js 객체 
                let lines = data.split("\n");   // 행 단위로 분리
                let output = "CSV 반환 결과<br>";

                        let parts = lines[i].split(",");

            }

    }
    </script>
</head>
<body>

</body>
</html>
