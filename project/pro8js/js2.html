<!DOCTYPE html>     <!--<!DOCTYPE html> 있어야 html-5이다. 없으면 html이다.-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>* 변수 연습 * </h2>
    <script>
        //var aa;    // 전통적인(옛날) 변수 선언 방식, 함수 단위 선언, 같은 이름으로 재선언 가능
        //var aa;     // var로는 두번해도 에러 안남 
        let aa;      // 모던(modern)한 변수 선언 방식 , EcmaScript6 형식을 따름, 블록 단위. 같은 이름으로 재선언 불가
        //let aa;      // 이건 두번 하면 에러 남
        aa = 100; 
        let bb = 20.5;
        const cc = 300;    // 상수로 선언. 값 수정 불가
        bb= bb + 10;
        //cc= cc + 10;    // err : 상수로 지정했었기 때문에 수정하는 식을 에러가 뜬다. 
        let dd = false;   // Boolean 값 기억
        let msg = "변수 선언 이해";   // 문자열 기억
        
        document.write(aa, "  ", bb, "  ", cc, "  ", msg);
        document.write("<br>");
        document.write("type 확인 : ", typeof(aa),"  ", typeof(bb),"  ", typeof(dd),"  ", typeof(msg))
        document.write("<br>");
        document.write("type 확인 : ", typeof(1), "  ",typeof(-1.5), 
                            "  ",typeof(TRUE),"  ", typeof('안녕'),
                            "  ",typeof(null), "  ",typeof(undefined))
                            
        // 참조형(참조타입) 변수
        document.write("<br>");
        let kbs = {name : "kbs 방송"};
        let mbc = kbs;    //  주소 치환 
        document.write(kbs.name, " ", mbc.name);
        
        
        document.write("<br>");
        {  // {독립 영역(블록)을 선언  }   변수 scope  
            let v1=1;
            var kk = 50;      // 호이스팅(Hoisting) 발생 - 전역 변수로 인식 됨 
            document.write(v1, " ", kk);
            {
                let v2=2;
                document.write("<br>",v2, " ",kk);
                {
                    let v3 = 3;     // 현재 영역에서만 유효 - 지역 변수
                    document.write("<br>",v3, " ",kk);
                    document.write("<br>",v1, " ",v2);


                }

                // document.write("<br>",v3);  // err : v3 영역 밖에서 호출 불가
            }
        }

        document.write("<br>",kk);

    </script>
    <br><br>
    <h2>*js 연산자 *</h2>
    <script>
        let x=5, y=2;
        document.write(x, "  ", y);
        document.write(" <br> 산술 연산 :  ", x+y," ", x/y, " ", x%y );
        document.write("<br> 논리 연산 : ", x>y, "  ", x<=y, "  ", x==y, " ", x != y);
        document.write("<br>논리 연산(%%:and, || : or)  : ", x>y  && x<=y, " ", x>y || x<=y)      
        document.write
        document.write
    
    
    </script>
</body>
</html>
