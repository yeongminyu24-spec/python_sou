<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이벤트</title>
    <script>
        function func1(){
            document.getElementById("show").innerHTML = "<i>전통적인 이벤트 처리</i>"
        }

        let a =10;
        let b = {
            funcNew1:function(){
                document.getElementById("show").innerHTML = "b 객체의 메소드 처리";
            },
            funcNew2:function(){
                document.getElementById("show").innerHTML = "<h1>b 객체의 멤버 처리</h1>";
            }
            // b객체에 멤버 1,2가 있는데 얘네들은 함수이다. 
        }
    </script>
    <script>
        // window.onload :
        // HTML문서와 이미지, CSS 같은 페이지 리소스가 모두 로딩된 후 자동 발생 이벤트
        //window.onload = alert("ok");
        window.onload = function(){ // 이름이 없는 함수 - 1회용으로 사용
            // alert("good");
            const exBtn1 = document.getElementById("btn1");  //특정 id를 가진 버튼을 읽어 변수에 저장
            //exBtn1.onclick = function(){  // 이벤트 장착 onclick 이벤트가 실행됨 
            //    document.getElementById("show").innerHTML = "클릭 1 선택";
        
            
        exBtn1.onclick = bt1Func;   // 함수 호출 

        const exBtn2 = document.getElementsByName("myBtn")  // s가 붙어서 복수, name 호출, 중복이 가능하므로 배열에 기억
        console.log(exBtn2.length);   //  console 창 보면 2개
        exBtn2[0].onclick = function(){
            document.getElementById("show").innerHTML = "클릭 2 누름";
        }
        exBtn2[1].onclick = function(){
            document.getElementById("show").innerHTML = "<h2>클릭 3을 누르다니</h2>";
        }
        const exBtn4 = document.getElementsByTagName("button")[3];  // tag명 지적.
        exBtn4.onclick = function(){
            document.getElementById("show").innerHTML = "클릭4 선택 ";
        }

        // 이벤트 연결 및 해제
        // addEventListener("이벤트 종류", 핸들러 함수)
        document.getElementById("btn5").addEventListener("click",abcFunc); // 이벤트 연결
    }
        function bt1Func(){
            document.getElementById("show").innerHTML = "클릭 1 선택 와우";   // 이 함수는 밖에 있어야 한다, 호출
        }

        function abcFunc(){
            //alert("abc");
            document.getElementById("show").innerHTML= "클릭 5 이벤트 연결 처리"

            document.getElementById("btn5").removeEventListener("click", abcFunc) // 두번 클릭하면 이벤트 해제
        }
    
            

        
    </script>
</head>
<body>
<h2>이벤트 처리 : 이벤트 핸들러 연결</h2>
<input type="button" value="버튼1" onclick="func1()"><br>
<input type="button" value="버튼2" onclick="b.funcNew1()"><br>
<input type="button" value="버튼3" onclick="b.funcNew2()"><br>
<hr>
<!--
<button id="btn1" onclick="이벤트처리함수()">라벨</button> 이건 html 내의 js를 기술. w3c는 비권장
-->
<button id="btn1">클릭1</button><br>
<button id="btn2" name="myBtn">클릭2</button><br>
<button id="btn3" name="myBtn">클릭3</button><br>
<button id="btn4">클릭4</button><br>
<button id="btn5">클릭5</button><br>
<div id="show"></div>
</body>
</html>
