        -- iframe 연습 --<br> 
        <!--
        frame : 웹 브라우저 화면 영역에 html이 랜더링 되는 영역 : 1개만 존재
        iframe : frame 내에 sub frame을 만들 수 있다. - 한 화면에 여러 개의 html 문서 표현이 가능
        -->
        <iframe src="web2.html" width="50%" height="100" style="border: none;" name="tiger"></iframe>
